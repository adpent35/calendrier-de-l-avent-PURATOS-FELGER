<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="gear">⚙️</button>

    <h1>🎄 Calendrier de l'Avent Puratos Felger 2026 🎄</h1>

    <div id="calendar"></div>

    <div id="modal" class="modal">
        <span id="close">&times;</span>
        <img id="modalImage" alt="Photo du jour">
        <p id="modalText"></p>
    </div>

    <div id="adminPanel">

        <h2>⚙️ Administration</h2>

        <p>Mode réservé à l'administrateur</p>

        <hr>

        <h3>Mode Test</h3>

        <label for="testDay">
            Déverrouiller jusqu'au jour :
        </label>

        <select id="testDay">
            <option value="">Choisir un jour</option>
        </select>

        <button onclick="setTestDay()">
            🔓 Déverrouiller
        </button>

        <button onclick="resetTestDay()">
            🔒 Retour au mode normal
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
