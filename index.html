<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="gear">⚙️</button>

    <h1>🎄 Calendrier de l'Avent 2026 🎄</h1>

    <div id="calendar"></div>

    <div id="modal" class="modal">
        <span id="close">&times;</span>
        <img id="modalImage" alt="">
        <p id="modalText"></p>
    </div>

<div id="adminPanel">

    <h2>Administration</h2>

    <label>Jour :</label>
    <select id="daySelect"></select>

    <label>Photo :</label>
    <input type="file" id="photoInput" accept="image/*">

    <label>Message :</label>
    <textarea id="messageInput"></textarea>

    <button onclick="saveDay()">
        💾 Enregistrer
    </button>

    <hr>

    <h3>Mode Test</h3>

    <label>Déverrouiller jusqu'au jour :</label>

    <select id="testDay">
        <option value="">Aucun</option>
    </select>

    <button onclick="setTestDay()">
        🔓 Déverrouiller
    </button>

    <button onclick="resetTestDay()">
        🔒 Retour mode normal
    </button>

</div>

    <script src="script.js"></script>

</body>

</html>
